<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup: text encoding, mobile scaling, and the tab title -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Card Binder</title>
  <!--
    The site's icon (the open card binder), shown on the browser tab, in
    bookmarks, and on a phone's home screen. Browsers pick the size they
    need: 32px for tabs, 192px for Android, and "apple-touch-icon" (180px)
    for iPhones and iPads.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!--
    This tiny script runs BEFORE the page draws, so the saved light/dark choice
    is applied right away. Without it, the page could flash the wrong colors.
    It reads the same saved "theme" as the other pages, so they all match.
  -->
  <script>
    (function () {
      var theme = null;
      // Try to read the saved theme. Some browsers block storage, so we guard it.
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      // No saved choice? Follow the device's own light/dark setting.
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- All the page's styles live in style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top bar: the app title (left) and the light/dark switch (upper right) -->
  <header class="topbar">
    <h1>MTG Card Binder</h1>

    <!--
      The middle of the top bar: where the binder is saved.
      (A binder's .JSON download is on the My Binders page now, under each
      binder; uploading one is in its New binder window.)
    -->
    <div class="binder-tools">
      <!--
        Google Drive save status: "Saved to Drive", "Saving…", or (when the
        Google sign-in has run out) a "Connect Drive" button to sign in again.
        aria-live makes screen readers announce changes to it.
      -->
      <span id="syncStatus" class="sync-status" aria-live="polite"></span>
      <button id="syncConnect" class="tool-link" type="button" hidden>
        <!-- Cloud icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"/>
        </svg>
        Connect Drive
      </button>
    </div>
    <!--
      The theme switch. role="switch" + aria-checked tell screen readers
      it's an on/off control ("on" here means dark mode).
    -->
    <button id="themeSwitch" class="theme-switch" type="button" role="switch"
            aria-checked="false" aria-label="Dark mode">
      <!-- Sun icon (light mode side) -->
      <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
        <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
      </svg>
      <!-- Moon icon (dark mode side) -->
      <svg class="icon moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
      </svg>
      <!-- The sliding round knob -->
      <span class="thumb"></span>
    </button>
  </header>

  <main>
    <!--
      The open binder. It starts empty here; javascript.js adds all
      the pages (each with 16 pockets, showing a saved card or a "+")
      and shows one or two pages at a time.
    -->
    <section id="binder" class="binder" aria-label="Card binder">
      <!--
        Two drop spots, hidden until a card is being dragged (aria-hidden:
        they only work with dragging, so screen readers skip them):
        - "move to another binder": a blue circle with a folder-and-arrow,
          1/3 of the way down the binder. Dropping a card on it opens the
          "Move card to…" window.
        - "remove card": a red circle with an X, 1/3 of the way up from the
          bottom. Dropping a card on it takes the card out of the binder.
      -->
      <div id="binderMove" class="binder-move" aria-hidden="true">
        <!-- Folder with an arrow going into it -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 13h7M13 10l3 3-3 3"/>
        </svg>
      </div>
      <div id="binderTrash" class="binder-trash" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round">
          <path d="M7 7l10 10M17 7L7 17"/>
        </svg>
      </div>
    </section>

    <!--
      The "Move card to…" window: opens when a card is dropped on the blue
      move circle. A <dialog> is a pop-up window built into the browser: it
      sits on top of the page and dims everything behind it.
      - If the pocket holds several copies, a "How many to move" box.
      - The list (filled in by javascript.js) has a button for each of the
        user's other binders; picking one moves the card there.
      - Below it, a name box and "New binder & move" make a new binder with
        just this card in it.
      method="dialog" means Cancel just closes the window.
    -->
    <dialog id="moveCardDialog" class="move-dialog" aria-labelledby="moveCardTitle">
      <form method="dialog">
        <h2 id="moveCardTitle" class="dialog-title">Move card to…</h2>
        <p id="moveCardText" class="dialog-text"></p>
        <!--
          "How many to move": only shown when the pocket holds more than one
          copy of the card. A number box from 1 up to how many you own
          (javascript.js sets the limit and starts it at all of them); the
          rest stay in this binder.
        -->
        <div id="moveHowMany" class="move-how-many" hidden>
          <label class="field-label" for="moveAmount">How many to move</label>
          <div class="move-amount-row">
            <input id="moveAmount" class="move-amount" type="number" min="1" step="1" inputmode="numeric">
            <span id="moveAmountNote" class="move-amount-note"></span>
          </div>
        </div>
        <div id="moveTargets" class="move-targets"></div>

        <div class="move-new">
          <label class="field-label" for="moveNewName">Or move it to a new binder</label>
          <div class="move-new-row">
            <div class="name-field">
              <input id="moveNewName" class="name-input" type="text"
                     maxlength="12" autocomplete="off" spellcheck="false">
              <!-- "5 / 12": how many characters are used of the limit -->
              <span id="moveNewCount" class="name-count" aria-live="polite"></span>
            </div>
            <button id="moveToNewButton" class="dialog-button primary" type="button">New binder &amp; move</button>
          </div>
        </div>

        <!-- Messages (like "Moving…" or "That binder is full") -->
        <p id="moveMessage" class="move-message" role="status"></p>

        <div class="dialog-buttons">
          <button value="cancel" class="dialog-button" type="submit">Cancel</button>
        </div>
      </form>
    </dialog>

    <!--
      The "Remove this card?" window: opens when "−" is tapped on a card
      that has only one copy left. "No" comes first so pressing Enter does
      the safe thing. javascript.js fills in the card's name.
    -->
    <dialog id="removeCardDialog" class="move-dialog" aria-labelledby="removeCardTitle">
      <form method="dialog">
        <h2 id="removeCardTitle" class="dialog-title">Remove card?</h2>
        <p id="removeCardText" class="dialog-text"></p>
        <div class="dialog-buttons">
          <button value="no" class="dialog-button" type="submit">No</button>
          <button value="yes" class="dialog-button danger" type="submit">Yes, remove</button>
        </div>
      </form>
    </dialog>

    <!-- Previous / Next page links, with the current page number between them -->
    <nav class="page-nav" aria-label="Binder pages">
      <button id="prevPage" class="page-link" type="button">&larr; Previous page</button>
      <span id="pageStatus" class="page-status" aria-live="polite"></span>
      <button id="nextPage" class="page-link" type="button">Next page &rarr;</button>
    </nav>
  </main>

  <!--
    Footer: links to every page in the project (the same list is on the
    other pages). aria-current marks the page you're on: screen readers say
    "current page", and style.css shows it as plain bold text.
    javascript.js fills in this binder's name and adds it to the card search
    link, so "Add to binder" over there knows which binder to use.
    Two links have a long and a short label: phones show the short one
    ("Binders", "Finder"), so the footer stays on one line (style.css).
  -->
  <footer class="site-footer">
    <nav aria-label="All pages">
      <ul class="footer-links">
        <li><a href="index.html"><span class="label-long">My Binders</span><span class="label-short">Binders</span></a></li>
        <li><a id="thisBinderLink" href="binder.html" aria-current="page">Binder</a></li>
        <li><a id="cardSearchLink" href="cardsearch.html"><span class="label-long">MTG Card Finder</span><span class="label-short">Finder</span></a></li>
        <!-- How to use the site (opens to the Binder pages instructions) -->
        <li><a href="help.html#binder">Help</a></li>
      </ul>
    </nav>
    <!-- "Sign out" at the far right ("Sign in with Google" when using the app
         locally, without signing in). Hidden until someone is using the binders. -->
    <button id="footerSignOut" class="footer-signout" type="button" hidden>Sign out</button>
  </footer>

  <!-- Google's sign-in library (from Google's own website) -->
  <script src="https://accounts.google.com/gsi/client" async></script>

  <!-- Shared code for saving and loading the binders' cards -->
  <script src="binder-storage.js"></script>

  <!-- Shared code for Google sign-in and saving binders to Google Drive -->
  <script src="google-drive.js"></script>

  <!-- All the page's code lives in javascript.js -->
  <script src="javascript.js"></script>
</body>
</html>
